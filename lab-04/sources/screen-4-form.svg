33B" font-weight="normal" text-anchor="middle">Скасувати</text><rect x="648" y="602" width="180" height="40" rx="8" fill="#45454F" opacity="1"/><text x="738.0" y="626.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Зберегти</text><rect x="950" y="168" width="466" height="220" rx="10" fill="#FFFFFF" opacity="1" stroke="#D6D6DC" stroke-width="1"/><text x="970" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#33333B" font-weight="bold" text-anchor="start">Як це працює</text><text x="970" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6E6E7A" font-weight="normal" text-anchor="start">Добірка прив'язується до сценарію</text><text x="970" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6E6E7A" font-weight="normal" text-anchor="start">і запускається з головного екрана</text><text x="970" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6E6E7A" font-weight="normal" text-anchor="start">одним дотиком. Тривалість задає</text><text x="970" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6E6E7A" font-weight="normal" text-anchor="start">довжину черги відтворення.</text></g><text x="750.0" y="1046" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6E6E7A" font-weight="normal" text-anchor="middle">Рис. Форма введення: помилка розміщена під своїм полем за законом близькості</text></svg>