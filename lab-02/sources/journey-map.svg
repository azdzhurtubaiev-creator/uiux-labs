<text x="940" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#F5F3FA" font-weight="normal">різких змін</text><rect x="40" y="454" width="1043" height="140" rx="12" fill="#1C1724"/><text x="48" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold">3. Тривале прослуховування</text><text x="48" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD" font-weight="normal">Працює 1-2 години, зрідка</text>
<text x="48" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD" font-weight="normal">пропускає трек</text><text x="318" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Про застосунок можна забути</text><text x="568" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Випадковий трек збиває</text>
