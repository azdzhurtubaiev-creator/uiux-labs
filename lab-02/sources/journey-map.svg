<text x="940" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#F5F3FA" font-weight="normal">плейлистів</text><rect x="40" y="302" width="1043" height="140" rx="12" fill="#1C1724"/><text x="48" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold">2. Запуск сценарію</text><text x="48" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD" font-weight="normal">Обирає сценарій «Навчання»,</text>
