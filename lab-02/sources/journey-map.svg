<text x="940" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#F5F3FA" font-weight="normal">сценарію»</text><rect x="40" y="606" width="1043" height="140" rx="12" fill="#1C1724"/><text x="48" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold">4. Завершення</text><text x="48" y="660" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD" font-weight="normal">Перемикає на сценарій «Сон» або</text>
<text x="48" y="677" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD" font-weight="normal">вимикає звук</text><text x="318" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Поступове стихання без різкої</text>
<text x="318" y="653" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">тиші</text><text x="568" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Забуває вимкнути, музика</text>
<text x="568" y="653" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">грає всю ніч</text><text x="760" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#A78BFA" font-weight="bold">6/10</text><rect x="760" y="654" width="9" height="8" rx="2" fill="#A78BFA"/><rect x="773" y="654" width="9" height="8" rx="2" fill="#A78BFA"/><rect x="786" y="654" width="9" height="8" rx="2" fill="#A78BFA"/><rect x="799" y="654" width="9" height="8" rx="2" fill="#A78BFA"/><rect x="812" y="654" width="9" height="8" rx="2" fill="#A78BFA"/><rect x="825" y="654" width="9" height="8" rx="2" fill="#A78BFA"/><rect x="838" y="654" width="9" height="8" rx="2" fill="#2A2433"/><rect x="851" y="654" width="9" height="8" rx="2" fill="#2A2433"/><rect x="864" y="654" width="9" height="8" rx="2" fill="#2A2433"/><rect x="877" y="654" width="9" height="8" rx="2" fill="#2A2433"/><text x="940" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#F5F3FA" font-weight="normal">Таймер згасання за</text>
