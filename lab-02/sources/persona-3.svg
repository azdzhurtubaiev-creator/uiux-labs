</g><text x="78" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#F5F3FA" font-weight="bold">Олег Дорошенко</text><text x="78" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD" font-weight="normal">Менеджер з логістики, щоденні</text>
<text x="78" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD" font-weight="normal">поїздки</text><line x1="78" y1="348" x2="348" y2="348" stroke="#2A2433"/><text x="78" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#A78BFA" font-weight="normal">"Мені потрібно ввімкнути музику до</text>
<text x="78" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#A78BFA" font-weight="normal">початку руху і більше її не</text>
<text x="78" y="414" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#A78BFA" font-weight="normal">чіпати."</text><text x="78" y="461" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ДЕМОГРАФІЯ</text>
<text x="78" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- 31 рік, Київ, живе з родиною</text>
<text x="78" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Щодня 50-70 хвилин за кермом у</text>
<text x="78" y="523" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  кожен бік</text>
<text x="78" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Android, музика через Bluetooth-</text>
<text x="78" y="563" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  магнітолу</text><text x="78" y="595" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9C96AD">Технічна впевненість</text>
<rect x="238" y="585" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="260" y="585" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="282" y="585" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="304" y="585" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="326" y="585" width="16" height="10" rx="3" fill="#2A2433"/><text x="78" y="621" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9C96AD">Залученість у музику</text>
<rect x="238" y="611" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="260" y="611" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="282" y="611" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="304" y="611" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="326" y="611" width="16" height="10" rx="3" fill="#2A2433"/><text x="78" y="647" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9C96AD">Терпимість до пошуку</text>
<rect x="238" y="637" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="260" y="637" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="282" y="637" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="304" y="637" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="326" y="637" width="16" height="10" rx="3" fill="#2A2433"/><text x="408" y="142" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">КОНТЕКСТ ВИКОРИСТАННЯ</text>
<text x="408" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Слухає музику переважно в авто, рідше - у</text>
<text x="408" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  офісі</text>
<text x="408" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Під час руху взаємодія з екраном мінімальна</text>
<text x="408" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  й небезпечна</text>
<text x="408" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Часто потрапляє в зони з нестабільним</text>
<text x="408" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  покриттям</text><text x="408" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ЦІЛІ</text>
<text x="408" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Запустити добірку на всю поїздку одним</text>
<text x="408" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  дотиком</text>
<text x="408" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Не залежати від якості мобільного зв'язку в</text>
<text x="408" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  дорозі</text>
<text x="408" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Мати спокійніший фон у вечірній зворотній</text>
<text x="408" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  дорозі</text><text x="408" y="462" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">БОЛЬОВІ ТОЧКИ</text>
<text x="408" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Відтворення зупиняється, коли зникає мережа</text>
<text x="408" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Дрібні підписи нечитабельні швидким поглядом</text>
<text x="408" y="528" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Після перезапуску авто застосунок починає з</text>
<text x="408" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  початку списку</text><rect x="774" y="126" width="301" height="300" rx="14" fill="#1C1724"/><text x="790" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">СЦЕНАРІЙ ВЗАЄМОДІЇ</text>
<text x="790" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Сідає в авто о 8:10, телефон</text>
<text x="790" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">підключається до магнітоли. Обирає</text>
<text x="790" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">сценарій «Дорога», добірка на 60</text>
<text x="790" y="249" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">хвилин завантажена заздалегідь і</text>
<text x="790" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">грає без перерв навіть у тунелі.</text>
<text x="790" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Увечері той самий сценарій дає</text>
<text x="790" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">спокійніший темп.</text></svg>