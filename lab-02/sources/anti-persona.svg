<text x="106" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#F5F3FA" font-weight="bold">Volna · Anti-Persona</text>
<text x="106" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD">Anti-Persona</text>
<line x1="48" y1="98" x2="1075" y2="98" stroke="#2A2433" stroke-width="1"/><rect x="48" y="122" width="330" height="340" rx="16" fill="#1C1724"/><circle cx="123" cy="200" r="38" fill="#2A2433"/><text x="108" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#9C96AD">!</text><text x="78" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#F5F3FA" font-weight="bold">Віктор Сердюк</text><text x="78" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD" font-weight="normal">Саунд-продюсер, колекціонер вінілу</text><text x="78" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#9C96AD" font-weight="normal">"Мені потрібен точний контроль над</text>
<text x="78" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#9C96AD" font-weight="normal">кожним параметром звучання."</text><text x="408" y="142" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ЧОМУ НЕ НАША АУДИТОРІЯ</text>
<text x="408" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Слухає музику як самостійне заняття, а не як</text>
<text x="408" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  фон до іншої діяльності</text>
<text x="408" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Потребує lossless-якості, параметричного</text>
<text x="408" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  еквалайзера й роботи з метаданими</text>
<text x="408" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Збирає власну бібліотеку файлів, не довіряє</text>
<text x="408" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  автоматичним добіркам</text>
<text x="408" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Оцінює сервіс за глибиною каталогу рідкісних</text>
<text x="408" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  записів</text><rect x="774" y="126" width="301" height="330" rx="14" fill="#1C1724"/><text x="798" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">МЕЖІ ПРОДУКТУ</text>
<text x="798" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Volna не конкурує з професійними</text>
<text x="798" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">аудіоредакторами та сервісами для</text>
<text x="798" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">аудіофілів. Автоматичний добір під</text>
<text x="798" y="249" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">активність прямо суперечить</text>
<text x="798" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">потребі ручного контролю, тому</text>
<text x="798" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">розширення функцій у цей бік</text>
<text x="798" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">розмиє продукт і ускладнить</text>
<text x="798" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">головний сценарій для первинної</text>
<text x="798" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">персони.</text></svg>