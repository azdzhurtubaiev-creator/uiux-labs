</g><text x="78" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#F5F3FA" font-weight="bold">Марина Левченко</text><text x="78" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD" font-weight="normal">Junior QA engineer, займається у</text>
<text x="78" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD" font-weight="normal">залі</text><line x1="78" y1="348" x2="348" y2="348" stroke="#2A2433"/><text x="78" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#A78BFA" font-weight="normal">"На тренуванні руки зайняті - я не</text>
<text x="78" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#A78BFA" font-weight="normal">хочу шукати потрібний трек між</text>
<text x="78" y="414" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#A78BFA" font-weight="normal">підходами."</text><text x="78" y="461" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ДЕМОГРАФІЯ</text>
<text x="78" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- 26 років, Дніпро, орендує</text>
<text x="78" y="501" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  квартиру</text>
<text x="78" y="523" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Повна зайнятість у продуктовій</text>
<text x="78" y="541" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  компанії</text>
<text x="78" y="563" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- iPhone, бездротові навушники,</text>
<text x="78" y="581" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  годинник з пульсометром</text><text x="78" y="613" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9C96AD">Технічна впевненість</text>
<rect x="238" y="603" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="260" y="603" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="282" y="603" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="304" y="603" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="326" y="603" width="16" height="10" rx="3" fill="#2A2433"/><text x="78" y="639" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9C96AD">Залученість у музику</text>
<rect x="238" y="629" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="260" y="629" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="282" y="629" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="304" y="629" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="326" y="629" width="16" height="10" rx="3" fill="#2A2433"/><text x="78" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9C96AD">Терпимість до пошуку</text>
<rect x="238" y="655" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="260" y="655" width="16" height="10" rx="3" fill="#A78BFA"/>
<rect x="282" y="655" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="304" y="655" width="16" height="10" rx="3" fill="#2A2433"/>
<rect x="326" y="655" width="16" height="10" rx="3" fill="#2A2433"/><text x="408" y="142" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">КОНТЕКСТ ВИКОРИСТАННЯ</text>
<text x="408" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Тренується 4 рази на тиждень, по 70-90</text>
<text x="408" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  хвилин</text>
<text x="408" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Музика задає темп: розминка, робочі підходи,</text>
<text x="408" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  заминка</text>
<text x="408" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Під час тренування телефон у кишені або на</text>
<text x="408" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  лаві</text><text x="408" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ЦІЛІ</text>
<text x="408" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Отримати добірку, що збігається з</text>
<text x="408" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  інтенсивністю тренування</text>
<text x="408" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Керувати відтворенням мінімальною кількістю</text>
<text x="408" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  дотиків</text>
<text x="408" y="404" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Зберігати вдалі добірки, щоб повторювати їх</text><text x="408" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">БОЛЬОВІ ТОЧКИ</text>
<text x="408" y="466" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Спокійний трек посеред важкого підходу</text>
<text x="408" y="484" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  збиває настрій</text>
<text x="408" y="506" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Дрібні елементи керування важко влучити</text>
<text x="408" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">  спітнілими руками</text>
<text x="408" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">- Реклама між треками розриває тренування</text><rect x="774" y="126" width="301" height="300" rx="14" fill="#1C1724"/><text x="790" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">СЦЕНАРІЙ ВЗАЄМОДІЇ</text>
<text x="790" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">Приходить у зал, вмикає сценарій</text>
<text x="790" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">«Тренування». Під час розминки грає</text>
<text x="790" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">помірний темп, далі застосунок</text>
<text x="790" y="249" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">підвищує інтенсивність. Між</text>
<text x="790" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">підходами вона натискає велику</text>
<text x="790" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">кнопку пропуску, не знімаючи</text>
<text x="790" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal">рукавички.</text></svg>