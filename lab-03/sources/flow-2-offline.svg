<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><rect width="1123" height="794" fill="#141019"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(48 36) scale(0.0859375)"><rect width="512" height="512" rx="90" fill="#1C1724"/><rect x="50" y="195" width="28" height="120" rx="14" fill="#A78BFA"/><rect x="98" y="160" width="28" height="230" rx="14" fill="#A78BFA"/><rect x="146" y="195" width="28" height="70" rx="14" fill="#A78BFA"/><rect x="194" y="185" width="28" height="160" rx="14" fill="#A78BFA"/><rect x="242" y="215" width="28" height="60" rx="14" fill="#A78BFA"/><rect x="290" y="86" width="28" height="340" rx="14" fill="#A78BFA"/><rect x="338" y="215" width="28" height="140" rx="14" fill="#A78BFA"/><rect x="386" y="130" width="28" height="210" rx="14" fill="#A78BFA"/><rect x="434" y="220" width="28" height="100" rx="14" fill="#A78BFA"/></g><text x="106" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#F5F3FA" font-weight="bold">Volna · User Flow 2</text><text x="106" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD">Підготовка добірки до офлайн-поїздки · персона Олег Дорошенко</text><line x1="48" y1="98" x2="1075" y2="98" stroke="#2A2433"/><rect x="48" y="150" width="130" height="58" rx="29.0" fill="#A78BFA"/><text x="113.0" y="183.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1C1724" font-weight="bold" text-anchor="middle">Старт</text><rect x="208" y="150" width="190" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="303.0" y="183.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Головний екран</text><rect x="428" y="150" width="200" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="528.0" y="174.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Довгий дотик на картці</text><text x="528.0" y="192.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">«Дорога»</text><rect x="658" y="150" width="200" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="758.0" y="183.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Контекстне меню картки</text><rect x="888" y="150" width="165" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="970.5" y="174.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">«Завантажити для</text><text x="970.5" y="192.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">офлайну»</text><polygon points="940.0,268 1060,327.0 940.0,386 820,327.0" fill="#1C1724" stroke="#A78BFA" stroke-width="1.4"/><text x="940.0" y="331.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.0" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Достатньо місця?</text><rect x="470" y="285" width="260" height="84" rx="10" fill="#1C1724" stroke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="600.0" y="322.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#9C96AD" font-weight="normal" text-anchor="middle">Повідомлення про брак місця та</text><text x="600.0" y="340.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#9C96AD" font-weight="normal" text-anchor="middle">пропозиція очистити кеш</text><rect x="820" y="452" width="240" height="74" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="940.0" y="484.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Завантаження з індикатором</text><text x="940.0" y="502.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">обсягу</text><rect x="500" y="452" width="250" height="74" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="625.0" y="484.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Картка позначена значком</text><text x="625.0" y="502.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">«офлайн»</text><rect x="260" y="460" width="150" height="58" rx="29.0" fill="#A78BFA"/><text x="335.0" y="493.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1C1724" font-weight="bold" text-anchor="middle">Кінець</text><path d="M178 179.0 L208 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M398 179.0 L428 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M628 179.0 L658 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M858 179.0 L888 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M970.5 208 L940.0 268" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M820 327.0 L730 327.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="775.0" y="319.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">ні</text><path d="M940.0 386 L940.0 452" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="958.0" y="411.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">так</text><path d="M600.0 285 L600 232 L303 232 L303.0 208" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="451.5" y="222.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">повернення</text><path d="M820 489.0 L750 489.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M500 489.0 L410 489.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="60" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПОЗНАЧЕННЯ</text><rect x="60" y="611" width="26" height="16" rx="4" fill="#1C1724" stroke="#2A2433"/><text x="96" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">екран або дія користувача</text><polygon points="73,633 86,643 73,653 60,643" fill="#1C1724" stroke="#A78BFA"/><text x="96" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">точка розгалуження</text><rect x="60" y="659" width="26" height="16" rx="4" fill="#1C1724" stroke="#9C96AD" stroke-dasharray="4 3"/><text x="96" y="672" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">стан помилки</text><rect x="420" y="586" width="643" height="158" rx="14" fill="#1C1724"/><text x="446" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПРОЄКТНЕ РІШЕННЯ</text><text x="446" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">Завантаження ініціюється з тієї самої картки сценарію, що й відтворення, без</text><text x="446" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">переходу в окремий розділ налаштувань. Гілка помилки не є тупиковою: повідомлення</text><text x="446" y="686" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">містить дію відновлення (очищення кешу) і повертає користувача на головний екран,</text><text x="446" y="707" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">зберігаючи намір завантаження.</text></svg>