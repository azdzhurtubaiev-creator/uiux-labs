oke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="416.0" y="187.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#9C96AD" font-weight="normal" text-anchor="middle">Тайм-аут 5 с</text><path d="M268 183.0 L306 183.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="564" y="148" width="220" height="70" rx="10" fill="#1C1724" stroke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="674.0" y="187.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#9C96AD" font-weight="normal" text-anchor="middle">Перемикання на кеш</text><path d="M526 183.0 L564 183.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="822" y="148" width="220" height="70" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="932.0" y="187.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Банер «офлайн-режим»</text><path d="M784 183.0 L822 183.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">Відтворення не переривається: плеєр переходить на завантажені треки сценарію.</text><text x="48" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#A78BFA" font-weight="bold">Порожня бібліотека в нового користувача</text><rect x="48" y="348" width="220" height="70" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="158.0" y="387.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Відкрито «Бібліотеку»</text><rect x="306" y="348" width="220" height="70" rx="10" fill="#1C1724" stroke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="416.0" y="387.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#9C96AD" font-weight="normal" text-anchor="middle">Збережених добірок немає</text><path d="M268 383.0 L306 383.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="564" y="348" width="220" height="70" rx="10" fill="#1C1724" stroke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="674.0" y="387.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#9C96AD" font-weight="normal" text-anchor="middle">Пояснення та кнопка дії</text><path d="M526 383.0 L564 383.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="822" y="348" width="220" height="70" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="932.0" y="387.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Перехід до сценаріїв</text><path d="M784 383.0 L822 383.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">Порожній стан не є тупиком: єдина кнопка веде на головний екран-хаб.</text><text x="48" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#A78BFA" font-weight="bold">Помилка завантаження добірки</text><rect x="48" y="548" width="220" height="70" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="158.0" y="587.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Запит добірки</text><rect x="306" y="548" width="220" height="70" rx="10" fill="#1C1724" stroke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="416.0" y="587.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#9C96AD" font-weight="normal" text-anchor="middle">Відповідь із помилкою</text><path d="M268 583.0 L306 583.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="564" y="548" width="220" height="70" rx="10" fill="#1C1724" stroke="#9C96AD" stroke-width="1.2" stroke-dasharray="5 4"/><text x="674.0" y="587.13" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#9C96AD" font-weight="normal" text-anchor="middle">Повідомлення з причиною</text><path d="M526 583.0 L564 583.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="822" y="548" width="220" height="70" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="932.0" y="578.73" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Повтор або вибір іншого</text><text x="932.0" y="595.53" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.8" fill="#F5F3FA" font-weight="normal" text-anchor="middle">сценарію</text><path d="M784 583.0 L822 583.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">Повідомлення називає причину й дає дію відновлення, а не лише код помилки.</text><text x="48" y="710" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПОЗНАЧЕННЯ</text><rect x="48" y="721" width="26" height="16" rx="4" fill="#1C1724" stroke="#2A2433"/><text x="84" y="734" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">звичайний стан</text><rect x="48" y="745" width="26" height="16" rx="4" fill="#1C1724" stroke="#9C96AD" stroke-dasharray="4 3"/><text x="84" y="758" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">стан помилки або порожній стан</text></svg>