<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><rect width="1123" height="794" fill="#141019"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(48 36) scale(0.0859375)"><rect width="512" height="512" rx="90" fill="#1C1724"/><rect x="50" y="195" width="28" height="120" rx="14" fill="#A78BFA"/><rect x="98" y="160" width="28" height="230" rx="14" fill="#A78BFA"/><rect x="146" y="195" width="28" height="70" rx="14" fill="#A78BFA"/><rect x="194" y="185" width="28" height="160" rx="14" fill="#A78BFA"/><rect x="242" y="215" width="28" height="60" rx="14" fill="#A78BFA"/><rect x="290" y="86" width="28" height="340" rx="14" fill="#A78BFA"/><rect x="338" y="215" width="28" height="140" rx="14" fill="#A78BFA"/><rect x="386" y="130" width="28" height="210" rx="14" fill="#A78BFA"/><rect x="434" y="220" width="28" height="100" rx="14" fill="#A78BFA"/></g><text x="106" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#F5F3FA" font-weight="bold">Volna · User Flow 3</text><text x="106" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD">Відхилення треку під час тренування · персона Марина Левченко</text><line x1="48" y1="98" x2="1075" y2="98" stroke="#2A2433"/><rect x="48" y="150" width="130" height="58" rx="29.0" fill="#A78BFA"/><text x="113.0" y="183.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1C1724" font-weight="bold" text-anchor="middle">Старт</text><rect x="208" y="150" width="210" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="313.0" y="174.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Плеєр у сценарії</text><text x="313.0" y="192.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">«Тренування»</text><rect x="448" y="150" width="210" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="553.0" y="174.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Трек не відповідає</text><text x="553.0" y="192.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">інтенсивності</text><rect x="688" y="150" width="210" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="793.0" y="174.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Дотик на кнопці «Далі»</text><text x="793.0" y="192.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">(64 px)</text><polygon points="793.0,268 918,327.0 793.0,386 668,327.0" fill="#1C1724" stroke="#A78BFA" stroke-width="1.4"/><text x="793.0" y="331.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.0" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Утримання понад 1 с?</text><rect x="350" y="285" width="250" height="84" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="475.0" y="331.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Меню: «Не для цього сценарію»</text><rect x="668" y="452" width="250" height="74" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="793.0" y="493.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Наступний трек добірки</text><rect x="350" y="452" width="250" height="74" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="475.0" y="484.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Трек виключено з профілю</text><text x="475.0" y="502.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">сценарію</text><rect x="120" y="460" width="150" height="58" rx="29.0" fill="#A78BFA"/><text x="195.0" y="493.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1C1724" font-weight="bold" text-anchor="middle">Кінець</text><path d="M178 179.0 L208 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M418 179.0 L448 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M658 179.0 L688 179.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M793.0 208 L793.0 268" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M668 327.0 L600 327.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="634.0" y="319.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">так</text><path d="M793.0 386 L793.0 452" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="807.0" y="411.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">ні</text><path d="M475.0 369 L475.0 452" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M668 489.0 L600 489.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M350 489.0 L270 489.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="60" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПОЗНАЧЕННЯ</text><rect x="60" y="611" width="26" height="16" rx="8" fill="#A78BFA"/><text x="96" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">початок / кінець сценарію</text><rect x="60" y="635" width="26" height="16" rx="4" fill="#1C1724" stroke="#2A2433"/><text x="96" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">екран або дія користувача</text><polygon points="73,657 86,667 73,677 60,667" fill="#1C1724" stroke="#A78BFA"/><text x="96" y="672" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">точка розгалуження</text><rect x="420" y="586" width="643" height="158" rx="14" fill="#1C1724"/><text x="446" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПРОЄКТНЕ РІШЕННЯ</text><text x="446" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">Коротке та довге натискання розведено на одному елементі керування: короткий дотик</text><text x="446" y="665" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">пропускає трек, довгий відкриває відмітку «не для цього сценарію». Це дозволяє не</text><text x="446" y="686" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">додавати другу кнопку на екран, який використовується спітнілими руками, і</text><text x="446" y="707" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">зберігає розмір цілі 64 px за ISO 9241-400.</text></svg>