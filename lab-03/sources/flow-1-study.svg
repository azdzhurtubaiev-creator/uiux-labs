<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><rect width="1123" height="794" fill="#141019"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(48 36) scale(0.0859375)"><rect width="512" height="512" rx="90" fill="#1C1724"/><rect x="50" y="195" width="28" height="120" rx="14" fill="#A78BFA"/><rect x="98" y="160" width="28" height="230" rx="14" fill="#A78BFA"/><rect x="146" y="195" width="28" height="70" rx="14" fill="#A78BFA"/><rect x="194" y="185" width="28" height="160" rx="14" fill="#A78BFA"/><rect x="242" y="215" width="28" height="60" rx="14" fill="#A78BFA"/><rect x="290" y="86" width="28" height="340" rx="14" fill="#A78BFA"/><rect x="338" y="215" width="28" height="140" rx="14" fill="#A78BFA"/><rect x="386" y="130" width="28" height="210" rx="14" fill="#A78BFA"/><rect x="434" y="220" width="28" height="100" rx="14" fill="#A78BFA"/></g><text x="106" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#F5F3FA" font-weight="bold">Volna · User Flow 1</text><text x="106" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD">Запуск сценарію «Навчання» · персона Денис Ковальчук</text><line x1="48" y1="98" x2="1075" y2="98" stroke="#2A2433"/><rect x="48" y="130" width="130" height="58" rx="29.0" fill="#A78BFA"/><text x="113.0" y="163.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1C1724" font-weight="bold" text-anchor="middle">Старт</text><rect x="208" y="130" width="180" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="298.0" y="163.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Запуск застосунку</text><rect x="418" y="130" width="190" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="513.0" y="163.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Екран-заставка, 2 с</text><rect x="638" y="130" width="190" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="733.0" y="154.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Головний екран: сітка</text><text x="733.0" y="172.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">з 4 сценаріїв</text><rect x="848" y="130" width="184" height="58" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="940.0" y="154.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Дотик на картці</text><text x="940.0" y="172.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">«Навчання»</text><polygon points="940.0,232 1060,288.0 940.0,344 820,288.0" fill="#1C1724" stroke="#A78BFA" stroke-width="1.4"/><text x="940.0" y="292.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.0" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Добірку кешовано?</text><rect x="500" y="253" width="250" height="70" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="625.0" y="283.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Формування добірки, індикатор</text><text x="625.0" y="301.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">прогресу</text><rect x="820" y="400" width="240" height="74" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="940.0" y="432.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Плеєр: відтворення з першого</text><text x="940.0" y="450.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">треку</text><rect x="500" y="400" width="250" height="74" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="625.0" y="441.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Фоновий режим, екран гасне</text><rect x="280" y="408" width="150" height="58" rx="29.0" fill="#A78BFA"/><text x="355.0" y="441.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1C1724" font-weight="bold" text-anchor="middle">Кінець</text><path d="M178 159.0 L208 159.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M388 159.0 L418 159.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M608 159.0 L638 159.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M828 159.0 L848 159.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M940.0 188 L940.0 232" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M820 288.0 L750 288.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="785.0" y="280.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">ні</text><path d="M940.0 344 L940 400" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="962.0" y="364.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">так</text><path d="M625.0 323 L625 370 L870 370 L870 400" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M820 437.0 L750 437.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><path d="M500 437.0 L430 437.0" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><text x="60" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПОЗНАЧЕННЯ</text><rect x="60" y="541" width="26" height="16" rx="8" fill="#A78BFA"/><text x="96" y="554" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">початок / кінець сценарію</text><rect x="60" y="565" width="26" height="16" rx="4" fill="#1C1724" stroke="#2A2433"/><text x="96" y="578" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">екран або дія користувача</text><polygon points="73,587 86,597 73,607 60,597" fill="#1C1724" stroke="#A78BFA"/><text x="96" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD">точка розгалуження</text><rect x="440" y="556" width="623" height="188" rx="14" fill="#1C1724"/><text x="466" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПРОЄКТНЕ РІШЕННЯ</text><text x="466" y="618" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">Головна дія сценарію коштує одного дотику після запуску застосунку. Гілка «ні»</text><text x="466" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">не блокує інтерфейс: формування добірки супроводжується індикатором прогресу, а</text><text x="466" y="662" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">перший доступний трек починає грати, не чекаючи на повне формування списку.</text><text x="466" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">Кількість екранів від запуску до звуку - два, що відповідає правилу трьох</text><text x="466" y="706" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">кліків.</text></svg>