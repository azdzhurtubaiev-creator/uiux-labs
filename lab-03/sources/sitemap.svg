<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><rect width="1123" height="794" fill="#141019"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(48 36) scale(0.0859375)"><rect width="512" height="512" rx="90" fill="#1C1724"/><rect x="50" y="195" width="28" height="120" rx="14" fill="#A78BFA"/><rect x="98" y="160" width="28" height="230" rx="14" fill="#A78BFA"/><rect x="146" y="195" width="28" height="70" rx="14" fill="#A78BFA"/><rect x="194" y="185" width="28" height="160" rx="14" fill="#A78BFA"/><rect x="242" y="215" width="28" height="60" rx="14" fill="#A78BFA"/><rect x="290" y="86" width="28" height="340" rx="14" fill="#A78BFA"/><rect x="338" y="215" width="28" height="140" rx="14" fill="#A78BFA"/><rect x="386" y="130" width="28" height="210" rx="14" fill="#A78BFA"/><rect x="434" y="220" width="28" height="100" rx="14" fill="#A78BFA"/></g><text x="106" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#F5F3FA" font-weight="bold">Volna · Карта екранів (Sitemap)</text><text x="106" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD">Інформаційна архітектура застосунку, рівні вкладеності 0-2</text><line x1="48" y1="98" x2="1075" y2="98" stroke="#2A2433"/><rect x="430" y="124" width="264" height="50" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="562.0" y="153.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Екран-заставка (рівень 0)</text><rect x="400" y="210" width="324" height="54" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="562.0" y="232.625" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Головний екран - хаб сценаріїв (рівень</text><text x="562.0" y="250.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">1)</text><path d="M562.0 174 L562.0 210" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="320" width="200" height="50" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="160.0" y="349.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Плеєр (рівень 2)</text><path d="M562.0 264 L562.0 292 L160.0 292 L160.0 320" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="90" y="420" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="175.0" y="446.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Черга відтворення</text><path d="M74 442 L90 442" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="90" y="476" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="175.0" y="502.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Деталі треку</text><path d="M74 498 L90 498" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="90" y="532" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="175.0" y="558.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Таймер згасання</text><path d="M74 554 L90 554" stroke="#3A3348" stroke-width="1.4" fill="none"/><path d="M74 370 L74 554" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="330" y="320" width="200" height="50" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="430.0" y="349.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Бібліотека (рівень 2)</text><path d="M562.0 264 L562.0 292 L430.0 292 L430.0 320" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="420" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="445.0" y="446.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Мої добірки</text><path d="M344 442 L360 442" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="360" y="476" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="445.0" y="502.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Історія прослуханого</text><path d="M344 498 L360 498" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="360" y="532" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="445.0" y="558.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Завантажене (офлайн)</text><path d="M344 554 L360 554" stroke="#3A3348" stroke-width="1.4" fill="none"/><path d="M344 370 L344 554" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="600" y="320" width="200" height="50" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="700.0" y="349.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Пошук (рівень 2)</text><path d="M562.0 264 L562.0 292 L700.0 292 L700.0 320" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="630" y="420" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="715.0" y="446.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Результати пошуку</text><path d="M614 442 L630 442" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="630" y="476" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="715.0" y="502.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Фільтри добірок</text><path d="M614 498 L630 498" stroke="#3A3348" stroke-width="1.4" fill="none"/><path d="M614 370 L614 498" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="870" y="320" width="200" height="50" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="970.0" y="349.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Профіль (рівень 2)</text><path d="M562.0 264 L562.0 292 L970.0 292 L970.0 320" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-end="url(#a)"/><rect x="900" y="420" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="985.0" y="446.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Налаштування</text><path d="M884 442 L900 442" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="900" y="476" width="170" height="44" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="985.0" y="502.025" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Про застосунок</text><path d="M884 498 L900 498" stroke="#3A3348" stroke-width="1.4" fill="none"/><path d="M884 370 L884 498" stroke="#3A3348" stroke-width="1.4" fill="none"/><rect x="60" y="610" width="1003" height="134" rx="14" fill="#1C1724"/><text x="86" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ПРИНЦИП ПОБУДОВИ</text><text x="86" y="668" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">Структура має три рівні вкладеності. Рівень 0 - заставка, рівень 1 - головний екран-хаб зі сценаріями діяльності, рівень 2 -</text><text x="86" y="688" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">чотири функціональні розділи. Сценарії винесені на рівень 1 замість списку плейлистів, оскільки всі три персони з практичної</text><text x="86" y="708" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">роботи 2 показали низьку терпимість до ручного пошуку. Глибина обмежена трьома рівнями, тому будь-який екран досяжний не більше</text><text x="86" y="728" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">ніж за три дотики.</text></svg>