<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794"><rect width="1123" height="794" fill="#141019"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(48 36) scale(0.0859375)"><rect width="512" height="512" rx="90" fill="#1C1724"/><rect x="50" y="195" width="28" height="120" rx="14" fill="#A78BFA"/><rect x="98" y="160" width="28" height="230" rx="14" fill="#A78BFA"/><rect x="146" y="195" width="28" height="70" rx="14" fill="#A78BFA"/><rect x="194" y="185" width="28" height="160" rx="14" fill="#A78BFA"/><rect x="242" y="215" width="28" height="60" rx="14" fill="#A78BFA"/><rect x="290" y="86" width="28" height="340" rx="14" fill="#A78BFA"/><rect x="338" y="215" width="28" height="140" rx="14" fill="#A78BFA"/><rect x="386" y="130" width="28" height="210" rx="14" fill="#A78BFA"/><rect x="434" y="220" width="28" height="100" rx="14" fill="#A78BFA"/></g><text x="106" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#F5F3FA" font-weight="bold">Volna · Навігаційна модель</text><text x="106" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9C96AD">Гібридна модель: хаб-і-спиці на головному екрані + вкладкова панель</text><line x1="48" y1="98" x2="1075" y2="98" stroke="#2A2433"/><circle cx="300" cy="330" r="74" fill="#1C1724" stroke="#A78BFA" stroke-width="1.6"/><text x="300" y="326.55" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold" text-anchor="middle">Головний</text><text x="300" y="346.55" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold" text-anchor="middle">екран-хаб</text><rect x="105" y="188" width="150" height="46" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="180.0" y="215.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Навчання</text><path d="M241.2 279.6 L205.2 247.0" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="395" y="188" width="150" height="46" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="470.0" y="215.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Тренування</text><path d="M363.0 279.6 L443.0 247.0" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="105" y="428" width="150" height="46" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="180.0" y="455.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Дорога</text><path d="M241.2 380.4 L205.2 415.0" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="395" y="428" width="150" height="46" rx="10" fill="#1C1724" stroke="#2A2433" stroke-width="1"/><text x="470.0" y="455.375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA" font-weight="normal" text-anchor="middle">Сон</text><path d="M363.0 380.4 L443.0 415.0" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="300" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">Чотири спиці = чотири сценарії діяльності</text><rect x="150" y="580" width="300" height="56" rx="14" fill="#1C1724" stroke="#2A2433"/><circle cx="200" cy="600" r="7" fill="#A78BFA"/><text x="200" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#A78BFA" text-anchor="middle">Сценарії</text><circle cx="300" cy="600" r="7" fill="#9C96AD"/><text x="300" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">Бібліотека</text><circle cx="400" cy="600" r="7" fill="#9C96AD"/><text x="400" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">Профіль</text><text x="300" y="662" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#9C96AD" text-anchor="middle">Нижня вкладкова панель, 3 вкладки</text><rect x="560" y="120" width="503" height="300" rx="14" fill="#1C1724"/><text x="586" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">РОЗГЛЯНУТІ МОДЕЛІ</text><text x="586" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold">Ієрархічна</text><text x="586" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">Глибоке дерево розділів. Відхилено: збільшує кількість дотиків</text><text x="586" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">до запуску відтворення.</text><text x="586" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#F5F3FA" font-weight="bold">Вкладкова</text><text x="586" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">Рівноправні розділи без центру. Відхилено як самостійна</text><text x="586" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">модель: не виділяє головну дію.</text><text x="586" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#A78BFA" font-weight="bold">Хаб-і-спиці</text><text x="586" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">Центральний екран із виходами на сценарії. Обрано як основу</text><text x="586" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#9C96AD">головного екрана.</text><rect x="560" y="440" width="503" height="304" rx="14" fill="#1C1724"/><text x="586" y="472" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#A78BFA" font-weight="bold" letter-spacing="0.8">ОБҐРУНТУВАННЯ ВИБОРУ</text><text x="586" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">Обрано гібридну модель. Головний екран побудовано як хаб: чотири</text><text x="586" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">сценарії діяльності є рівноправними виходами з центру, і запуск</text><text x="586" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">будь-якого з них коштує одного дотику. Нижня вкладкова панель із</text><text x="586" y="563" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">трьох елементів забезпечує постійний доступ до бібліотеки та</text><text x="586" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">профілю без повернення назад по стеку. Чиста ієрархія відхилена,</text><text x="586" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">бо кожен додатковий рівень відкладає головну дію - початок</text><text x="586" y="626" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">відтворення. Чиста вкладкова модель відхилена, бо робить усі</text><text x="586" y="647" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">розділи рівноцінними та не виділяє сценарії як основний спосіб</text><text x="586" y="668" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#F5F3FA">роботи із застосунком.</text></svg>